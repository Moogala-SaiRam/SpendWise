<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="coin" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Background Card / App Shape -->
  <rect width="512" height="512" rx="128" fill="url(#bg)" />

  <!-- Inner wallet/vault circle -->
  <g filter="url(#shadow)" transform="translate(256, 256)">
    <!-- Base Wallet Frame -->
    <rect x="-160" y="-110" width="320" height="230" rx="36" fill="#ffffff" />
    <rect x="-145" y="-95" width="290" height="200" rx="28" fill="#f8fafc" />

    <!-- Wallet Flap -->
    <path d="M-160 -40 C -80 -10, 80 -10, 160 -40 L 160 120 C 160 140, 140 156, 120 156 L -120 156 C -140 156, -160 140, -160 120 Z" fill="#047857" opacity="0.12" />

    <!-- Spending Trend Line / Growth -->
    <path d="M-110 70 L -40 20 L 20 45 L 110 -35" fill="none" stroke="#059669" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" />
    <polygon points="110,-55 118,-25 90,-30" fill="#059669" />

    <!-- Floating Gold Coin -->
    <circle cx="70" cy="-65" r="48" fill="url(#coin)" stroke="#ffffff" stroke-width="6" />
    <circle cx="70" cy="-65" r="36" fill="none" stroke="#fef3c7" stroke-width="4" stroke-dasharray="6,4" />
    <text x="70" y="-52" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="34" fill="#ffffff" text-anchor="middle">$</text>
  </g>
</svg>
